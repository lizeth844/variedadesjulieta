<main>


    <section class="page-hero parallax">

        <div>

            <p class="small-title">
                ESTAMOS PARA TI
            </p>

            <h1>
                Contáctanos
            </h1>

            <p>
                ¿Tienes alguna pregunta?
                Estamos aquí para ayudarte.
            </p>

        </div>

    </section>


    <section class="contact-section">




        <!-- FORMULARIO -->

        <div class="contact-form">

            <h2>
                Envíanos un mensaje
            </h2>


            <form id="contactForm">

                <label>
                    Nombre
                </label>

                <input
                    type="text"
                    name="nombre"
                    placeholder="Tu nombre"
                    required>


                <label>
                    Correo electrónico
                </label>

                <input
                    type="email"
                    name="correo"
                    placeholder="tu@email.com"
                    required>


                <label>
                    Mensaje
                </label>

                <textarea
                    name="mensaje"
                    rows="6"
                    placeholder="Escribe tu mensaje..."
                    required></textarea>


                <label class="privacy">

                    <input
                        type="checkbox"
                        required>

                    <span>
                        Acepto que mis datos sean utilizados
                        únicamente para responder a mi solicitud.
                    </span>

                </label>


                <button
                    type="submit"
                    class="btn">

                    Enviar mensaje

                </button>

            </form>

        </div>

        <!-- MAPA DE UBICACIÓN -->
        <div class="contact-map">
            <h2>Nuestra Ubicación</h2>
            <iframe src="https://www.google.com/maps/embed?pb=!4v1790623858171!6m8!1m7!1sQu3zSkyIXAH6ugMPS9k5dw!2m2!1d2.691228606918897!2d-75.32429274287107!3f47.51447126129564!4f-20.78232883445051!5f0.7820865974627469" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>

    </section>


</main>
